<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>録音</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@300;400&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --border: #2a2a2a;
    --text: #f0f0f0;
    --muted: #666;
    --accent: #6dd639;
    --accent-dim: rgba(109, 214, 57, 0.15);
    --red: #e05555;
    --red-dim: rgba(224, 85, 85, 0.15);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 300;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: 2rem 1.5rem;
    gap: 0;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 0.35em;
    color: var(--muted);
    margin-bottom: 3rem;
  }

  .category-badge {
    font-size: 11px;
    letter-spacing: 0.25em;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 4px 14px;
    margin-bottom: 2.5rem;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .category-badge.visible { opacity: 1; }

  .ring-container {
    position: relative;
    width: 180px;
    height: 180px;
    margin-bottom: 2.5rem;
  }

  .ring-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .ring-track {
    fill: none;
    stroke: var(--border);
    stroke-width: 1.5;
  }

  .ring-progress {
    fill: none;
    stroke: var(--accent);
    stroke-width: 1.5;
    stroke-linecap: butt;
    stroke-dasharray: 502;
    stroke-dashoffset: 502;
    transition: stroke-dashoffset 1s linear;
  }

  .ring-progress.recording {
    animation: none;
  }

  .record-btn {
    position: absolute;
    inset: 12px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: background 0.2s, border-color 0.2s;
    -webkit-tap-highlight-color: transparent;
  }

  .record-btn:active { transform: scale(0.97); }

  .record-btn.recording {
    background: var(--red-dim);
    border-color: var(--red);
  }

  .btn-icon {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--accent);
    transition: background 0.2s, border-radius 0.3s;
  }

  .record-btn.recording .btn-icon {
    background: var(--red);
    border-radius: 4px;
    width: 22px;
    height: 22px;
  }

  .btn-label {
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--muted);
  }

  .timer {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    letter-spacing: 0.05em;
    color: var(--text);
    margin-bottom: 0.5rem;
    min-height: 58px;
    opacity: 0.15;
    transition: opacity 0.3s;
  }

  .timer.active { opacity: 1; }

  .status {
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--muted);
    min-height: 18px;
    margin-bottom: 3rem;
  }

  .status .dot {
    display: inline-block;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--red);
    margin-right: 6px;
    vertical-align: middle;
    animation: blink 1s infinite;
    opacity: 0;
  }

  .status.recording .dot { opacity: 1; }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .upload-area {
    width: 100%;
    max-width: 280px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }

  .upload-area.visible {
    opacity: 1;
    pointer-events: all;
  }

  .upload-btn {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: #0f0f0f;
    border: none;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.25em;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .upload-btn:hover { opacity: 0.85; }
  .upload-btn:active { transform: scale(0.99); }
  .upload-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .result-msg {
    margin-top: 1rem;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-align: center;
    min-height: 16px;
  }

  .result-msg.success { color: #6dbf8a; }
  .result-msg.error { color: var(--red); }

  .retry-btn {
    display: none;
    margin-top: 2.5rem;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 10px;
    letter-spacing: 0.25em;
    font-family: 'Noto Sans JP', sans-serif;
    padding: 8px 20px;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }

  .retry-btn:hover { border-color: var(--muted); color: var(--text); }
  .retry-btn.visible { display: block; }
</style>
</head>
<body>

<div class="category-badge" id="categoryBadge">—</div>

<div class="ring-container">
  <svg class="ring-svg" viewBox="0 0 180 180">
    <circle class="ring-track" cx="90" cy="90" r="80"/>
    <circle class="ring-progress" id="ringProgress" cx="90" cy="90" r="80"/>
  </svg>
  <button class="record-btn" id="recordBtn" aria-label="録音開始・停止">
    <div class="btn-icon" id="btnIcon"></div>
    <span class="btn-label" id="btnLabel">REC</span>
  </button>
</div>

<div class="timer" id="timer">00:00</div>

<div class="status" id="status">
  <span class="dot"></span>
  <span id="statusText">タップして録音開始</span>
</div>

<div class="upload-area" id="uploadArea">
  <button class="upload-btn" id="uploadBtn">送信する</button>
  <div class="result-msg" id="resultMsg"></div>
</div>

<button class="retry-btn" id="retryBtn">もう一度録音する</button>

<script>
  const recordBtn = document.getElementById('recordBtn');
  const btnLabel = document.getElementById('btnLabel');
  const timer = document.getElementById('timer');
  const status = document.getElementById('status');
  const statusText = document.getElementById('statusText');
  const uploadArea = document.getElementById('uploadArea');
  const uploadBtn = document.getElementById('uploadBtn');
  const resultMsg = document.getElementById('resultMsg');
  const retryBtn = document.getElementById('retryBtn');
  const categoryBadge = document.getElementById('categoryBadge');
  const ringProgress = document.getElementById('ringProgress');

  let mediaRecorder = null;
  let audioChunks = [];
  let timerInterval = null;
  let seconds = 0;
  let audioBlob = null;
  let recordingStartTime = null;

  const CIRCUMFERENCE = 2 * Math.PI * 80;
  ringProgress.style.strokeDasharray = CIRCUMFERENCE;
  ringProgress.style.strokeDashoffset = CIRCUMFERENCE;

  function getCategory() {
    const h = new Date().getHours();
    return h < 12 ? '朝礼' : '終礼';
  }

  function updateCategory() {
    const cat = getCategory();
    categoryBadge.textContent = cat;
    categoryBadge.classList.add('visible');
  }

  function formatTime(s) {
    const m = Math.floor(s / 60).toString().padStart(2, '0');
    const sec = (s % 60).toString().padStart(2, '0');
    return m + ':' + sec;
  }

  const MAX_SEC = 1800;

  function updateRing(s) {
    const ratio = Math.min(s / MAX_SEC, 1);
    const offset = CIRCUMFERENCE * (1 - ratio);
    ringProgress.style.strokeDashoffset = offset;
  }

  recordBtn.addEventListener('click', async () => {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      stopRecording();
      return;
    }
    if (audioBlob) return;

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioChunks = [];
      recordingStartTime = new Date();
      updateCategory();

      const options = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
        ? { mimeType: 'audio/webm;codecs=opus' }
        : MediaRecorder.isTypeSupported('audio/mp4')
          ? { mimeType: 'audio/mp4' }
          : {};

      mediaRecorder = new MediaRecorder(stream, options);
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
        uploadArea.classList.add('visible');
        retryBtn.classList.add('visible');
        statusText.textContent = '録音完了';
        status.classList.remove('recording');
      };

      mediaRecorder.start(1000);

      recordBtn.classList.add('recording');
      status.classList.add('recording');
      timer.classList.add('active');
      btnLabel.textContent = 'STOP';
      statusText.textContent = '録音中';

      seconds = 0;
      timerInterval = setInterval(() => {
        seconds++;
        timer.textContent = formatTime(seconds);
        updateRing(seconds);
        if (seconds >= MAX_SEC) stopRecording();
      }, 1000);

    } catch (e) {
      statusText.textContent = 'マイクの許可が必要です';
    }
  });

  function stopRecording() {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
    recordBtn.classList.remove('recording');
    btnLabel.textContent = 'REC';
  }

  uploadBtn.addEventListener('click', async () => {
    if (!audioBlob) return;
    uploadBtn.disabled = true;
    resultMsg.textContent = 'アップロード中...';
    resultMsg.className = 'result-msg';

    const category = getCategory();
    const now = recordingStartTime || new Date();
    const pad = n => String(n).padStart(2, '0');
    const fileName = category + '_' + now.getFullYear() + pad(now.getMonth()+1) + pad(now.getDate()) + '_' + pad(now.getHours()) + pad(now.getMinutes()) + '.' + (audioBlob.type.includes('mp4') ? 'm4a' : 'webm');

    const reader = new FileReader();
    reader.onload = async () => {
      const base64 = reader.result.split(',')[1];
      try {
        await fetch('https://script.google.com/macros/s/AKfycbykJp2YrNQFGd6CDOmISRVKmEAjQq7yv0Ho1LXxKyToBw9XRF_PjxIhOtASlH2znxRhjg/exec', {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            action: 'upload',
            fileName: fileName,
            mimeType: audioBlob.type,
            data: base64,
            category: category
          })
        });
        resultMsg.textContent = category + 'フォルダへ送信しました';
        resultMsg.className = 'result-msg success';
        uploadBtn.textContent = '送信済み';
      } catch (e) {
        resultMsg.textContent = '送信失敗。再試行してください';
        resultMsg.className = 'result-msg error';
        uploadBtn.disabled = false;
      }
    };
    reader.readAsDataURL(audioBlob);
  });

  retryBtn.addEventListener('click', () => {
    audioBlob = null;
    audioChunks = [];
    seconds = 0;
    timer.textContent = '00:00';
    timer.classList.remove('active');
    ringProgress.style.strokeDashoffset = CIRCUMFERENCE;
    uploadArea.classList.remove('visible');
    retryBtn.classList.remove('visible');
    resultMsg.textContent = '';
    uploadBtn.disabled = false;
    uploadBtn.textContent = '送信する';
    categoryBadge.classList.remove('visible');
    statusText.textContent = 'タップして録音開始';
    status.classList.remove('recording');
    recordBtn.classList.remove('recording');
    btnLabel.textContent = 'REC';
    updateCategory();
  });

  updateCategory();
</script>
</body>
</html>
